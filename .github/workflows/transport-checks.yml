name: Outer LF transport checks
on:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  actual-bash-stdin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tools/check_lf_transport.py /tmp/pr26-outer-transport.json
