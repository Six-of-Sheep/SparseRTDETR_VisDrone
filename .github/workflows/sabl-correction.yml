name: Corrected S-A CPU acceptance
on:
  push:
    branches: ['codex/r18-sabl-common-correction']
permissions:
  contents: read
jobs:
  corrected-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2 faster-coco-eval==1.6.7 pycocotools==2.0.11 Pillow==11.3.0 tensorboard==2.21.0
      - run: python -m pip install torch==2.4.1+cpu torchvision==0.19.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -B tools/check_sabl_gt_correction.py /tmp/gt-correction
      - run: python -B tools/check_sabl_axis_norm.py /tmp/axis-norm.json
      - run: python -B tools/check_sabl_corrected_model.py /tmp/corrected-model
      - run: python -B tools/check_sabl_corrected_short.py /tmp/corrected-short-cli
      - run: python -B tools/check_sabl_ipc.py suite --out /tmp/sabl-ipc-cli
      - run: python -B tools/check_sabl_oom_replay.py /tmp/sabl-oom-cli
      - run: python -B tools/check_sabl_corrected_formal.py /tmp/corrected-formal-cli
      - run: python -B tools/check_sabl_pair_diagnostic.py /tmp/sabl-paired-cli
      - run: python -B tools/repo_manage.py check
      - run: python -B tools/repo_manage.py verify-import
      - run: python -B -m unittest discover -s tests -p test_repo_management.py
