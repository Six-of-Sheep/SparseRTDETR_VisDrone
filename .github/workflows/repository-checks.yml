name: Repository checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-and-management:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tools/repo_manage.py check
      - run: python -B tools/repo_manage.py verify-import
      - run: python -B -m unittest discover -s tests -p test_repo_management.py
      - run: python -m pip install -r environment/requirements-ci.txt
      - run: python -B test_slice_core.py
      - run: python -B test_seed_readout.py
      - run: python -m pip install -r environment/requirements-confirmation-ci.txt
      - name: Required confirmation and supplemental CPU regression (no skips)
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -B tools/check_confirmation_ci.py
      - name: Local-detail center design leaf (synthetic CPU only, no skips)
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -B tools/local_detail_cpu.py --check-only
      - run: python -m pip install -r environment/requirements-local-detail-cpu.txt
      - name: H2 full N U D CPU acceptance and exact state replay (no skips)
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -B tools/local_detail_model_cpu.py --check-only
      - name: H2 actual acceptance CLI scope limits cleanup and slim export (no skips)
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -B tools/check_h2_acceptance_cli.py --output /tmp/h2-cli-cpu
