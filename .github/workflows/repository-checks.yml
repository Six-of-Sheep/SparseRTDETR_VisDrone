name: Repository checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  readout-cli-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2 faster-coco-eval==1.6.7 Pillow==11.3.0
      - run: python -m pip install torch==2.4.1+cpu torchvision==0.19.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen scalar oracle and real CLI with synthetic inputs only
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -B tools/check_r18_readout_math.py
          python -B tools/check_r18_readout_cli.py /tmp/pr25-readout-cli-acceptance
          python -B tools/check_r18_full_chain.py /tmp/pr25-full-chain-acceptance
  source-and-management:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tools/repo_manage.py check
      - run: python -B tools/repo_manage.py verify-import
      - run: python -B -m unittest discover -s tests -p test_repo_management.py
      - run: python -m pip install -r environment/requirements-ci.txt
      - run: python -B test_slice_core.py
      - run: python -B test_seed_readout.py
      - run: python -m pip install -r environment/requirements-confirmation-ci.txt
      - name: Required confirmation and supplemental CPU regression (no skips)
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -B tools/check_confirmation_ci.py
