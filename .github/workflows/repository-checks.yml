name: Repository checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sabl-cli-cpu:
    if: github.ref != 'refs/heads/codex/r18-sabl-side-audit' && github.head_ref != 'codex/r18-sabl-side-audit' && github.ref != 'refs/heads/codex/r18-sabl-common-correction' && github.head_ref != 'codex/r18-sabl-common-correction'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2 faster-coco-eval==1.6.7 pycocotools==2.0.11 Pillow==11.3.0 tensorboard==2.21.0
      - run: python -m pip install torch==2.4.1+cpu torchvision==0.19.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Required native model and actual isolated CLI (synthetic CPU only)
        run: |
          python -B tools/check_sabl_formal_metadata.py /tmp/pr26-formal-metadata.json
          python -B tools/check_sabl_model.py /tmp/pr26-model.json
          python -B tools/check_sabl_state.py /tmp/pr26-state
          python -B tools/check_sabl_cli.py /tmp/pr26-cli
          python -B tools/check_sabl_formal_state.py /tmp/pr26-formal-state
          python -B tools/check_sabl_formal_cli.py /tmp/pr26-formal-cli
          python -B tools/check_sabl_diagnostic.py /tmp/pr26-diagnostic.json
          python -B tools/check_sabl_ns_eval.py /tmp/ns-eval-cli
  source-and-management:
    if: github.ref != 'refs/heads/codex/r18-sabl-side-audit' && github.head_ref != 'codex/r18-sabl-side-audit' && github.ref != 'refs/heads/codex/r18-sabl-common-correction' && github.head_ref != 'codex/r18-sabl-common-correction'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tools/repo_manage.py check
      - run: python -B tools/repo_manage.py verify-import
      - run: python -B tools/check_sabl_formal_policy.py /tmp/pr26-formal-policy.json
      - run: python -B tools/check_sabl_bind.py /tmp/pr26-bind-stdin.json
      - run: python -B -m unittest discover -s tests -p test_repo_management.py
      - run: python -m pip install -r environment/requirements-ci.txt
      - run: python -B test_slice_core.py
      - run: python -B test_seed_readout.py
      - run: python -m pip install -r environment/requirements-confirmation-ci.txt
      - name: Required confirmation and supplemental CPU regression (no skips)
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: python -B tools/check_confirmation_ci.py
