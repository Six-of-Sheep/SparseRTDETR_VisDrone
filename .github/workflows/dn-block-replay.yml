name: DN block replay CPU
on:
  push:
    branches: ['codex/r18-dn-block-replay']
  pull_request:
    paths: ['src/sparse_rtdetr/dn_block_replay.py', 'tools/check_dn_block_replay.py', '.github/workflows/dn-block-replay.yml']
permissions:
  contents: read
jobs:
  synthetic-native-dn:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
      - env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python -B tools/check_dn_block_replay.py
