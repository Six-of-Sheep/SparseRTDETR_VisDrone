name: Original S side-path CPU audit (no detector forward)
on:
  push:
    branches: ['codex/r18-sabl-side-audit']
permissions:
  contents: read
jobs:
  original-v1-side-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3 PyYAML==6.0.2 faster-coco-eval==1.6.7 pycocotools==2.0.11 Pillow==11.3.0 tensorboard==2.21.0
      - run: python -m pip install torch==2.4.1+cpu torchvision==0.19.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Actual original coder, decoder and criterion; expect defect reproduction
        run: python -B tools/audit_sabl_side_path.py --release . --out /tmp/sabl-side-path
      - run: python -B tools/repo_manage.py check
      - run: python -B tools/repo_manage.py verify-import
      - run: python -B -m unittest discover -s tests -p test_repo_management.py
